ype="password" required></div><button class="btn btn-primary">เข้าสู่ระบบ</button></form></div></div><div class="toast" id="toast"></div><script src="data.js"></script><script src="app.js?v=141"></script><script>document.getElementById('contactForm').addEventListener('submit',e=>{e.preventDefault();toast('ส่งข้อความเรียบร้อยแล้ว');e.target.reset()});</script></body></html>
